name: Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test Core closure
        run: python -m pytest -q tests/core tests/architecture

  # Non-blocking while the typed slice grows (governance plan WI-10): flip
  # continue-on-error off once the include list covers the whole scope package.
  typecheck:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyright
      - name: Pyright (basic, typed slice)
        run: python -m pyright

  lint-and-distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check scope_lineage tests
      - name: Build and verify archives
        run: |
          python -m build
          python tests/architecture/verify_distribution.py dist/*
      - name: Smoke installed wheel outside repository
        run: |
          python -m venv /tmp/scope-lineage-wheel
          /tmp/scope-lineage-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          # Explicit 1.0: this call kept v1 smoke-covered implicitly while 1.0 was the
          # default; with 2.0 as the default it must ask for v1 to keep covering it
          # through the deprecation window (drop together with v1).
          /tmp/scope-lineage-wheel/bin/scope-lineage parse \
            --task-file "$GITHUB_WORKSPACE/examples/tasks/customer/customer_profile_daily.json" \
            --contract-version 1.0 \
            --schema "$GITHUB_WORKSPACE/examples/metadata/schema_info.csv" \
            --target-ddl-metadata "$GITHUB_WORKSPACE/examples/metadata/target_tables" \
            --out /tmp/scope-lineage-output
          test -f /tmp/scope-lineage-output/customer_profile_daily/lineage.json
          test -f /tmp/scope-lineage-output/customer_profile_daily/diagnostics.json
          /tmp/scope-lineage-wheel/bin/scope-lineage parse \
            --task-file "$GITHUB_WORKSPACE/examples/tasks/customer/customer_profile_daily.json" \
            --contract-version 2.0 \
            --schema "$GITHUB_WORKSPACE/examples/metadata/schema_info.json" \
            --schema-fallback "$GITHUB_WORKSPACE/examples/metadata/schema_info.csv" \
            --target-ddl-metadata "$GITHUB_WORKSPACE/examples/metadata/target_tables" \
            --compact-json \
            --out /tmp/scope-lineage-output-v2
          test -f /tmp/scope-lineage-output-v2/customer_profile_daily/lineage.json
          test -f /tmp/scope-lineage-output-v2/customer_profile_daily/diagnostics.json

  sqlglot-compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sqlglot-version: ["30.0.0", "30.16.0", "30.17.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "sqlglot==${{ matrix.sqlglot-version }}"
      - name: Test SQLGlot scope compatibility
        run: |
          python -m pytest -q \
            tests/core/test_lineage_contract_baseline.py \
            tests/core/test_merge_scope_compat.py \
            tests/core/test_task_state_lineage.py \
            tests/core/test_task_lineage_contract_baseline.py
