[project]
name = "scope-lineage"
version = "0.2.0"
description = "Spark/Hive SQL parsing foundation for AI-ready task knowledge bases"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
keywords = ["sql", "lineage", "spark", "hive", "ai", "knowledge-base", "metadata"]
# Scope Lineage consumes SQLGlot optimizer scopes, whose shape may change in a minor release.
# Keep the upper bound at the next unverified minor and widen it only with cross-version contract
# tests; 30.16 and 30.17 intentionally expose different MERGE wrapper scopes.
dependencies = ["sqlglot>=30,<30.18", "jsonschema>=4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
scope-lineage = "scope_lineage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
# This public distribution is the parser, its versioned contracts, and contract-derived
# renderers only. Widening this package discovery rule changes the supported product boundary
# and requires an architecture review.
include = ["scope_lineage*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
scope_lineage = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Lint safety net for the ongoing core-module refactor. Intentionally narrow:
# catch the mechanical mistakes a function-extraction refactor is most likely to
# introduce (unused/undefined names), not style. No formatting is enforced.
target-version = "py39"

[tool.ruff.lint]
# Pyflakes (F) as the safety net for mechanical refactor mistakes; BLE001 so every
# blind `except Exception` must carry a noqa naming its reason; C901 at a threshold
# calibrated to the four legacy hotspots (each carries a dated exemption) so new
# complexity goes red while the stock is paid down. Add more codes deliberately.
select = ["F", "BLE", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 24
